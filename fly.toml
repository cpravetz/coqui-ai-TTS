# fly.toml app configuration file generated for cktkntts on 2025-02-05T11:35:17-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cktkntts'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # Set this to false temporarily for testing
  min_machines_running = 1
  processes = ["app"]

  [[http_service.ports]]
    handlers = ["http"]
    port = 80

  [[http_service.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"      # Make sure this endpoint exists in your Flask app
    port = 8000
    protocol = "http"
    timeout = "5s"
    tls_skip_verify = false

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 550
    soft_limit = 500


[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
